# Builds and tests the package on every pull request and on main, except when the change touches
# only Markdown files: nothing here reads them, and a macOS run costs eight minutes on an empty
# cache. The repository's ruleset requires no status check, so a documentation-only pull request
# stays mergeable without a run; if a required check is ever added, replace paths-ignore with a
# job that reports success. docs/development.md describes the jobs, the toolchains they pin and how
# to run the same commands locally.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

# A pull request's runs share one group, so a newer push cancels the run it supersedes. Every
# commit on main gets a group of its own: GitHub cancels a pending run when a newer one joins its
# group, and a shared group would leave some merged commits untested.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        id: toolchain
        run: |
          swift --version
          # For example swift-6.2.4-RELEASE. It is part of the cache key, so a new toolchain
          # starts from a clean build directory.
          echo "id=$(swift --version 2>&1 | sed -n '1s/.*(\([^ )]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Restore the build directory
        uses: actions/cache@v6
        with:
          path: .build/linux
          key: linux-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-${{ steps.toolchain.outputs.id }}-

      - name: Build
        run: swift build --build-tests --scratch-path .build/linux

      - name: Test
        run: |
          unset OPENJEV_TEST_MODEL OPENJEV_ENCODER_MODELS OPENJEV_LIVE_URL
          swift test --scratch-path .build/linux 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Check that only model tests were skipped
        run: .github/scripts/check-test-log.sh "$RUNNER_TEMP/swift-test.log"

  # TypeSafe's official SDKs against the Swift server over the stub backends (issue #39,
  # Tools/sdk-compat): Python 3.12 with typesafe-sdk, Node.js 20 with @typesafe-ai/sdk, and
  # NSStudent's JevSwiftSDK, each at the version Tools/sdk-compat pins. Linux, because the stub
  # server needs no Core ML, and the Linux job's toolchain and build directory.
  sdk-compat:
    name: SDK compatibility
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$(swift --version 2>&1 | sed -n '1s/.*(\([^ )]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      # The Linux job's cache, read only: that job saves it.
      - name: Restore the build directory
        uses: actions/cache/restore@v6
        with:
          path: .build/linux
          key: linux-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-${{ steps.toolchain.outputs.id }}-

      - name: Build the stub server
        run: swift build --product openjev-stub-server --scratch-path .build/linux

      # Ubuntu 24.04's python3 is CPython 3.12, the version the suite pins.
      - name: Install Python 3.12
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)'

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install the SDKs
        run: |
          node --version
          python3 -m venv Tools/sdk-compat/.venv
          Tools/sdk-compat/.venv/bin/python -m pip install --quiet --requirement Tools/sdk-compat/requirements.txt
          npm ci --prefix Tools/sdk-compat/typescript --no-audit --no-fund

      - name: Run the SDK checks
        run: |
          server="$(swift build --scratch-path .build/linux --show-bin-path)/openjev-stub-server"
          Tools/sdk-compat/.venv/bin/python Tools/sdk-compat/run.py \
            --server "$server" --swift-sdk --exchanges "$RUNNER_TEMP/sdk-compat"

      - name: Upload the exchanges and the server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-compat-exchanges
          path: ${{ runner.temp }}/sdk-compat
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Swift 6.3.3 meets mlx-swift's tools 6.3 floor.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        id: toolchain
        run: |
          sw_vers
          # Read the version once: piped into head, xcodebuild aborts when head closes the pipe
          # before the second line is written.
          version=$(xcodebuild -version)
          printf '%s\n' "$version"
          swift --version
          case "${version%%$'\n'*}" in
            "Xcode 26.6"*) ;;
            *)
              echo "::error::Expected Xcode 26.6 at $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          component=$(xcodebuild -showComponent MetalToolchain 2>&1 || true)
          printf '%s\n' "$component"
          echo "metal=$(awk -F': *' '/^Status:/ { print tolower($2); exit }' <<< "$component")" >> "$GITHUB_OUTPUT"
          # For example swiftlang-6.3.3.1.3. It is part of the cache key, so a new toolchain
          # starts from a clean build directory.
          echo "id=$(swift --version 2>&1 | sed -n '1s/.*(\([^ )]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      # The image installs the Metal Toolchain for every Xcode 26. Swift Build needs it to compile
      # mlx-swift's Metal shaders, so fetch it (839 MB) if an image ever ships without it.
      - name: Download the Metal Toolchain
        if: steps.toolchain.outputs.metal != 'installed'
        run: |
          echo "::warning::The image lacks the Metal Toolchain; downloading it"
          xcodebuild -downloadComponent MetalToolchain

      - name: Restore the build directory
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-${{ steps.toolchain.outputs.id }}-swiftbuild-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-${{ steps.toolchain.outputs.id }}-swiftbuild-

      # Swift Build rather than Xcode 26's default native build system: only Swift Build compiles
      # mlx-swift's Metal shaders, and without them MLX cannot run at all, on the CPU or the GPU.
      # With them the OpenJevDiffusionGemma tests can run MLX on the runner's GPU (D-028).
      - name: Build
        run: swift build --build-tests --build-system swiftbuild

      - name: Test
        run: |
          unset OPENJEV_TEST_MODEL OPENJEV_ENCODER_MODELS OPENJEV_LIVE_URL
          swift test --build-system swiftbuild 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Check that only model tests were skipped
        run: .github/scripts/check-test-log.sh "$RUNNER_TEMP/swift-test.log"

      # Runs even when the build or the tests failed, so one push reports both.
      - name: Lint
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: make lint

      # The JevBench harness's own test (Tools/jevbench, issue #61): a fake server inside the
      # process, the image's python3 and the standard library only, no model and no download.
      # Like the lint, it runs whatever the Swift steps did.
      - name: JevBench harness smoke test
        if: ${{ !cancelled() }}
        run: |
          python3 --version
          python3 Tools/jevbench/smoke_test.py

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # The same toolchain as the macOS job.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The committed shared scheme. It builds and tests OpenJevCore and OpenJevEncoders, and
      # nothing that needs Hummingbird or MLX. docs/development.md holds the same commands for
      # local runs.
      SCHEME: OpenJevCore-iOS
      # Every iOS runtime on the macos-26 image ships this device, and OS=latest picks the newest
      # runtime. The step below fails with a readable message if that stops being true.
      SIMULATOR: iPhone 17 Pro
      # Shared by the test and the build-only step, so both use one set of SwiftPM checkouts.
      DERIVED_DATA: .build/ios
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        id: toolchain
        run: |
          sw_vers
          # Read the version once: piped into head, xcodebuild aborts when head closes the pipe
          # before the second line is written.
          version=$(xcodebuild -version)
          printf '%s\n' "$version"
          swift --version
          case "${version%%$'\n'*}" in
            "Xcode 26.6"*) ;;
            *)
              echo "::error::Expected Xcode 26.6 at $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          component=$(xcodebuild -showComponent MetalToolchain 2>&1 || true)
          printf '%s\n' "$component"
          echo "metal=$(awk -F': *' '/^Status:/ { print tolower($2); exit }' <<< "$component")" >> "$GITHUB_OUTPUT"
          # For example swiftlang-6.3.3.1.3. It is part of the cache key, so a new toolchain
          # starts from clean checkouts.
          echo "id=$(swift --version 2>&1 | sed -n '1s/.*(\([^ )]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      # The build-only step below compiles mlx-swift's Metal shaders, which needs the component.
      # The image installs it for every Xcode 26, so this runs only if one ever ships without it.
      - name: Download the Metal Toolchain
        if: steps.toolchain.outputs.metal != 'installed'
        run: |
          echo "::warning::The image lacks the Metal Toolchain; downloading it"
          xcodebuild -downloadComponent MetalToolchain

      # xcodebuild keeps the SwiftPM checkouts and the clones they come from under the derived
      # data directory. Keyed like the macOS job, so a new toolchain or a dependency change starts
      # from an empty directory.
      - name: Restore the SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: ios-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: ios-${{ steps.toolchain.outputs.id }}-

      # xcodebuild wants a scheme whenever a derived data path is given, even to resolve.
      - name: Resolve the packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      # A destination that names a device fails when the image holds no such device, or more than
      # one of them on the newest runtime. Both produce a wall of xcodebuild output, so say it
      # here instead. Switch the destination to an identifier if an image ever ships duplicates.
      - name: Check that the simulator is unique
        run: |
          devices=$(xcrun simctl list devices available)
          printf '%s\n' "$devices"
          newest=$(awk '/^-- iOS /{ print $3 }' <<< "$devices" | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "::error::the image has no available iOS simulator runtime"
            exit 1
          fi
          # The device lines of that runtime read "    <name> (<identifier>) (<state>)". Matching
          # the name followed by a parenthesis keeps iPhone 17 Pro apart from iPhone 17 Pro Max.
          count=$(awk -v runtime="-- iOS $newest --" -v name="$SIMULATOR" '
            $0 == runtime { inside = 1; next }
            /^-- / { inside = 0 }
            inside && $0 ~ "^ *" name " \\(" { found++ }
            END { print found + 0 }
          ' <<< "$devices")
          echo "iOS $newest holds $count simulator(s) named $SIMULATOR"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one $SIMULATOR on iOS $newest, found $count"
            exit 1
          fi

      - name: Test on the simulator
        run: |
          unset OPENJEV_TEST_MODEL OPENJEV_ENCODER_MODELS OPENJEV_LIVE_URL
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR,OS=latest" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/$SCHEME.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Check that only model tests were skipped
        run: .github/scripts/check-test-log.sh "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/${{ env.SCHEME }}.xcresult
          if-no-files-found: ignore
          retention-days: 14

      # OpenJevDiffusionGemma declares iOS 17 like the rest of the package, so it must keep
      # compiling for iOS. Its tests stay out of the iOS job: they need weights that no iOS device
      # holds. Runs even when the tests failed, so one push reports both.
      - name: Build OpenJevDiffusionGemma for the simulator
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          xcodebuild build -quiet \
            -scheme OpenJevDiffusionGemma \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA"
