# The runner probe of issue #8: can GitHub-hosted macOS runners execute MLX's Metal kernels? It
# writes a throwaway Swift package that depends on the mlx-swift release OpenJevSwift pins, builds
# it with the native build system (no Metal shaders) and with Swift Build (which compiles them),
# and runs a matmul and a small MLXNN block on the CPU and on the GPU. A Python MLX build of the
# same MLX core checks the GPU independently of how SwiftPM builds the shaders. Every job writes
# its findings to the run summary; docs/07-risks-and-unknowns.md (R13) records the outcome.
name: MLX runner probe

on:
  # TEMPORARY: workflow_dispatch works only once the file is on main, so the branch that adds the
  # probe runs it on push. Removed before review.
  push:
    branches: [issue-7-ci]
    paths: [.github/workflows/mlx-probe.yml]
  workflow_dispatch:
    inputs:
      include_xlarge:
        description: Also probe macos-26-xlarge (M2 Pro with GPU acceleration, billed per minute)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MLX_SWIFT_VERSION: 0.32.2
  # mlx-swift 0.32.2 vendors MLX core at v0.32.2.
  MLX_PYTHON_VERSION: 0.32.2

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-15 and macos-26 are the generally available Apple silicon images; xcode-27 is the
        # public preview with the reference toolchain.
        runner: [macos-15, macos-26, xcode-27, macos-26-xlarge]
        exclude:
          - runner: ${{ inputs.include_xlarge && 'none' || 'macos-26-xlarge' }}
    steps:
      - name: Describe the host
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType
          ls -d /Applications/Xcode*.app
          mkdir -p "$RUNNER_TEMP/probe-logs"

      - name: Select the newest released Xcode on the image
        run: |
          app=$(python3 - <<'PY'
          import glob, os, subprocess
          def version(app):
              out = subprocess.run([app + "/Contents/Developer/usr/bin/xcodebuild", "-version"],
                                   capture_output=True, text=True).stdout.split()
              return tuple(int(part) for part in out[1].split("."))
          apps = [a for a in glob.glob("/Applications/Xcode_*.app")
                  if "beta" not in a and not os.path.islink(a)]
          print(max(apps, key=version))
          PY
          )
          echo "Selected $app"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          status=$(xcodebuild -showComponent MetalToolchain 2>&1 | awk -F': *' '/^Status:/ { print tolower($2); exit }')
          echo "Metal Toolchain: ${status:-unknown}"
          {
            echo "metal=${status:-unknown}"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "swift=$(swift --version 2>&1 | sed -n '1s/.*Swift version \([0-9.]*\).*/\1/p')"
          } >> "$GITHUB_OUTPUT"

      # Swift Build compiles mlx-swift's .metal sources and stops without the component.
      - name: Download the Metal Toolchain
        id: metal
        if: steps.toolchain.outputs.metal != 'installed'
        continue-on-error: true
        run: |
          start=$SECONDS
          xcodebuild -downloadComponent MetalToolchain
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          xcodebuild -showComponent MetalToolchain

      - name: Write the probe package
        run: |
          probe="$RUNNER_TEMP/mlx-probe"
          mkdir -p "$probe/Sources/mlx-probe"
          echo "PROBE=$probe" >> "$GITHUB_ENV"
          cat > "$probe/Package.swift" <<EOF
          // swift-tools-version: 6.2
          // A throwaway package for issue #8. It needs nothing from OpenJevSwift, only the same mlx-swift
          // release, so it runs on any runner that can load that release's manifest.
          import PackageDescription

          let package = Package(
              name: "mlx-probe",
              platforms: [.macOS(.v14)],
              dependencies: [
                  .package(url: "https://github.com/ml-explore/mlx-swift", exact: "${MLX_SWIFT_VERSION}")
              ],
              targets: [
                  .executableTarget(
                      name: "mlx-probe",
                      dependencies: [
                          .product(name: "MLX", package: "mlx-swift"),
                          .product(name: "MLXNN", package: "mlx-swift"),
                      ]
                  )
              ]
          )
          EOF
          cat > "$probe/Sources/mlx-probe/main.swift" <<'EOF'
          // Runs a matmul and a small MLXNN block on one MLX device and prints where they ran, how long
          // they took and how far the results are from the CPU's. Usage: mlx-probe cpu|gpu
          import Foundation
          import MLX
          import MLXNN
          import Metal

          guard CommandLine.arguments.count == 2, let type = DeviceType(rawValue: CommandLine.arguments[1])
          else {
              print("usage: mlx-probe cpu|gpu")
              exit(2)
          }

          func seconds(_ body: () -> Void) -> Double {
              let start = DispatchTime.now().uptimeNanoseconds
              body()
              return Double(DispatchTime.now().uptimeNanoseconds - start) / 1e9
          }

          func milliseconds(_ value: Double) -> String { String(format: "%.2f ms", value * 1000) }

          // What Metal itself reports, before MLX touches it.
          if let metal = MTLCreateSystemDefaultDevice() {
              print("metal.name: \(metal.name)")
              print("metal.architecture: \(metal.architecture.name)")
              let families: [(String, MTLGPUFamily)] = [
                  ("apple7", .apple7), ("apple8", .apple8), ("apple9", .apple9), ("metal3", .metal3),
              ]
              let supported = families.map { "\($0.0)=\(metal.supportsFamily($0.1))" }
              print("metal.families: \(supported.joined(separator: " "))")
              print("metal.recommendedMaxWorkingSetSize: \(metal.recommendedMaxWorkingSetSize >> 20) MiB")
          } else {
              print("metal.name: none (MTLCreateSystemDefaultDevice returned nil)")
          }

          // Whether the build put MLX's Metal library (the compiled GPU kernels) next to the executable.
          let directory = Bundle.main.executableURL!.resolvingSymlinksInPath().deletingLastPathComponent()
          let files = FileManager.default.enumerator(atPath: directory.path)?.compactMap { $0 as? String }
          let metallibs = (files ?? []).filter { $0.hasSuffix(".metallib") }
          print("build.metallib: \(metallibs.isEmpty ? "none" : metallibs.joined(separator: " "))")

          var failures = 0

          @MainActor
          func check(_ name: String, _ body: () throws -> String) {
              do {
                  print("PASS \(name): \(try withError { try body() })")
              } catch {
                  failures += 1
                  print("FAIL \(name): \(error)")
              }
          }

          Device.withDefaultDevice(Device(type)) {
              print("mlx.defaultDevice: \(Device.defaultDevice())")

              check("matmul") {
                  var results: [String] = []
                  for n in [64, 256, 1024] {
                      let a = MLXRandom.normal([n, n], key: MLXRandom.key(1))
                      let b = MLXRandom.normal([n, n], key: MLXRandom.key(2))
                      eval(a, b)
                      var product = matmul(a, b)
                      let first = seconds { eval(product) }
                      let repeated =
                          seconds {
                              for _ in 0..<10 {
                                  product = matmul(a, b)
                                  eval(product)
                              }
                          } / 10
                      let reference = matmul(a, b, stream: .cpu)
                      let difference = abs(product - reference).max().item(Float.self)
                      results.append(
                          "\(n)x\(n) first \(milliseconds(first)), then \(milliseconds(repeated)),"
                              + " max |x - cpu| \(difference)")
                  }
                  return results.joined(separator: "; ")
              }

              check("MLXNN block: Linear, GELU, RMSNorm, MultiHeadAttention with a causal mask") {
                  let x = MLXRandom.normal([2, 128, 256], key: MLXRandom.key(3))
                  let linear = Linear(256, 256)
                  let norm = RMSNorm(dimensions: 256)
                  let attention = MultiHeadAttention(dimensions: 256, numHeads: 8)
                  let mask = MultiHeadAttention.createAdditiveCausalMask(128)
                  eval(x, mask, linear, norm, attention)
                  func forward() -> MLXArray {
                      let h = norm(gelu(linear(x)))
                      return attention(h, keys: h, values: h, mask: mask)
                  }
                  var y = forward()
                  let first = seconds { eval(y) }
                  let repeated =
                      seconds {
                          for _ in 0..<10 {
                              y = forward()
                              eval(y)
                          }
                      } / 10
                  let reference = Device.withDefaultDevice(.cpu) { forward() }
                  let difference = abs(y - reference).max().item(Float.self)
                  return "shape \(y.shape), first \(milliseconds(first)), then \(milliseconds(repeated)),"
                      + " max |x - cpu| \(difference)"
              }

              let used = type == .gpu && failures == 0 ? "yes" : "no"
              print("mlx.gpuUsed: \(used), peak memory \(Memory.peakMemory >> 20) MiB")
          }

          exit(failures == 0 ? 0 : 1)
          EOF
          cat "$probe/Package.swift"

      - name: Build with the native build system
        id: build-native
        continue-on-error: true
        run: |
          start=$SECONDS
          status=0
          swift build --package-path "$PROBE" --scratch-path "$PROBE/.build-native" \
            --build-system native > "$RUNNER_TEMP/build-native.log" 2>&1 || status=$?
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          grep -v '^\[' "$RUNNER_TEMP/build-native.log" | tail -n 40
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          bin=$(swift build --package-path "$PROBE" --scratch-path "$PROBE/.build-native" \
            --build-system native --show-bin-path)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run on the CPU, native build
        id: native-cpu
        if: steps.build-native.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          "${{ steps.build-native.outputs.bin }}/mlx-probe" cpu 2>&1 | tee "$RUNNER_TEMP/probe-logs/native-cpu.log"

      - name: Run on the GPU, native build
        id: native-gpu
        if: steps.build-native.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          "${{ steps.build-native.outputs.bin }}/mlx-probe" gpu 2>&1 | tee "$RUNNER_TEMP/probe-logs/native-gpu.log"

      - name: Build with Swift Build
        id: build-swiftbuild
        continue-on-error: true
        run: |
          start=$SECONDS
          status=0
          swift build --package-path "$PROBE" --scratch-path "$PROBE/.build-swiftbuild" \
            --build-system swiftbuild > "$RUNNER_TEMP/build-swiftbuild.log" 2>&1 || status=$?
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          grep -v '^\[' "$RUNNER_TEMP/build-swiftbuild.log" | tail -n 40
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          bin=$(swift build --package-path "$PROBE" --scratch-path "$PROBE/.build-swiftbuild" \
            --build-system swiftbuild --show-bin-path)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run on the CPU, Swift Build
        id: swiftbuild-cpu
        if: steps.build-swiftbuild.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          "${{ steps.build-swiftbuild.outputs.bin }}/mlx-probe" cpu 2>&1 | tee "$RUNNER_TEMP/probe-logs/swiftbuild-cpu.log"

      - name: Run on the GPU, Swift Build
        id: swiftbuild-gpu
        if: steps.build-swiftbuild.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          "${{ steps.build-swiftbuild.outputs.bin }}/mlx-probe" gpu 2>&1 | tee "$RUNNER_TEMP/probe-logs/swiftbuild-gpu.log"

      # The Python wheels ship MLX's Metal library ready built, so this checks the GPU with the
      # same MLX core however SwiftPM builds the shaders, including on images whose Swift cannot
      # load mlx-swift's manifest.
      - name: Cross-check with Python MLX
        id: python
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "mlx==$MLX_PYTHON_VERSION"
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF' 2>&1 | tee "$RUNNER_TEMP/probe-logs/python.log"
          import time

          import mlx.core as mx

          print("mlx", mx.__version__, "metal available:", mx.metal.is_available())
          try:
              print("device info:", mx.device_info())
          except Exception as error:
              print("device info unavailable:", repr(error))
          failures = 0
          a = mx.random.normal((1024, 1024), key=mx.random.key(1))
          b = mx.random.normal((1024, 1024), key=mx.random.key(2))
          reference = mx.matmul(a, b, stream=mx.cpu)
          mx.eval(reference)
          for name, device in (("cpu", mx.cpu), ("gpu", mx.gpu)):
              try:
                  start = time.perf_counter()
                  product = mx.matmul(a, b, stream=device)
                  mx.eval(product)
                  elapsed = time.perf_counter() - start
                  difference = mx.abs(product - reference).max(stream=mx.cpu).item()
                  print(f"PASS {name}: 1024x1024 matmul {elapsed * 1000:.2f} ms, max |x - cpu| {difference}")
              except Exception as error:
                  failures += 1
                  print(f"FAIL {name}: {error!r}")
          raise SystemExit(failures)
          EOF

      - name: Summarize
        if: always()
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          XCODE: ${{ steps.toolchain.outputs.xcode }}
          SWIFT: ${{ steps.toolchain.outputs.swift }}
          METAL: ${{ steps.toolchain.outputs.metal }}
          METAL_DOWNLOAD: ${{ steps.metal.outcome }}
          METAL_SECONDS: ${{ steps.metal.outputs.seconds }}
          NATIVE_BUILD: ${{ steps.build-native.outcome }}
          NATIVE_SECONDS: ${{ steps.build-native.outputs.seconds }}
          NATIVE_CPU: ${{ steps.native-cpu.outcome }}
          NATIVE_GPU: ${{ steps.native-gpu.outcome }}
          SWIFTBUILD_BUILD: ${{ steps.build-swiftbuild.outcome }}
          SWIFTBUILD_SECONDS: ${{ steps.build-swiftbuild.outputs.seconds }}
          SWIFTBUILD_CPU: ${{ steps.swiftbuild-cpu.outcome }}
          SWIFTBUILD_GPU: ${{ steps.swiftbuild-gpu.outcome }}
          PYTHON_MLX: ${{ steps.python.outcome }}
        run: |
          download=
          case "$METAL_DOWNLOAD" in
            success | failure) download=", download ${METAL_DOWNLOAD} in ${METAL_SECONDS:-?} s" ;;
          esac
          displays=$(system_profiler SPDisplaysDataType)
          field() { printf '%s\n' "$displays" | awk -F': ' -v key="$1" '$1 ~ key { print $2; exit }'; }
          {
            echo "## $RUNNER_LABEL"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Host | $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) >> 30 )) GB |"
            echo "| GPU | $(field 'Chipset Model'), $(field 'Total Number of Cores') cores, $(field 'Metal') |"
            echo "| Toolchain | $XCODE, Swift $SWIFT, Metal Toolchain ${METAL}${download} |"
            echo
            echo "| Probe | Outcome |"
            echo "|---|---|"
            echo "| Native build | ${NATIVE_BUILD} in ${NATIVE_SECONDS:-?} s |"
            echo "| Native build, CPU run | ${NATIVE_CPU:-skipped} |"
            echo "| Native build, GPU run | ${NATIVE_GPU:-skipped} |"
            echo "| Swift Build | ${SWIFTBUILD_BUILD} in ${SWIFTBUILD_SECONDS:-?} s |"
            echo "| Swift Build, CPU run | ${SWIFTBUILD_CPU:-skipped} |"
            echo "| Swift Build, GPU run | ${SWIFTBUILD_GPU:-skipped} |"
            echo "| Python MLX $MLX_PYTHON_VERSION, CPU and GPU | ${PYTHON_MLX:-skipped} |"
            echo
            for log in "$RUNNER_TEMP"/probe-logs/*.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$(basename "$log" .log)</summary>"
              echo
              echo '```'
              cat "$log"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
